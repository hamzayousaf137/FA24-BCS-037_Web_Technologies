<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyShop - Product Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">MyShop</a>

        <button class="navbar-toggler" id="menu-button">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="product.html">Product Detail</a></li>
          </ul>
          <a class="nav-link text-white" href="#">&#128722; Cart</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    <div class="row">

      <div class="col-12 col-md-6 mb-4">
        <img src="Black_headphones.jpg" class="img-fluid" alt="Headphones">
      </div>

      <div class="col-12 col-md-6">
        <h1>Headphones</h1>
        <h3 class="price">Rs. 2,500</h3>
        <p>Comfortable wireless headphones with clear sound and long battery life.</p>

        <label for="qty">Quantity</label><br>
        <input type="number" id="qty" value="1" min="1" class="quantity-box">
        <br><br>
        <button class="btn btn-primary">Add to Cart</button>
      </div>

    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
      <div class="row">
        <div class="col-md-4">
          <h5>MyShop</h5>
          <p>Your online shop.</p>
        </div>
        <div class="col-md-4">
          <h5>Links</h5>
          <p><a href="index.html">Home</a><br><a href="product.html">Product Detail</a></p>
        </div>
        <div class="col-md-4">
          <h5>Contact</h5>
          <p>info@myshop.com<br>0300-1234567</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
