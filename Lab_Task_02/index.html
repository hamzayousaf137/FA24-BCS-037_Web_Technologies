<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">MyShop</a>

      <button class="navbar-toggler" id="menu-button">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        </ul>
        <a class="nav-link text-white" href="#">&#128722; Cart</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

      <div class="col">
        <div class="card">
          <img src="https://placehold.co/300x200?text=Product+1" class="card-img-top" alt="Product 1">
          <div class="card-body">
            <h5>Product 1</h5>
            <p>Rs. 1,000</p>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card">
          <img src="https://placehold.co/300x200?text=Product+2" class="card-img-top" alt="Product 2">
          <div class="card-body">
            <h5>Product 2</h5>
            <p>Rs. 1,500</p>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card">
          <img src="https://placehold.co/300x200?text=Product+3" class="card-img-top" alt="Product 3">
          <div class="card-body">
            <h5>Product 3</h5>
            <p>Rs. 2,000</p>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card">
          <img src="https://placehold.co/300x200?text=Product+4" class="card-img-top" alt="Product 4">
          <div class="card-body">
            <h5>Product 4</h5>
            <p>Rs. 2,500</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
